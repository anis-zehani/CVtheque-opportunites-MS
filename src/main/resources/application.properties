spring.application.name=Opportunite-MS
server.port=8002
#Register url for client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.instanceId=:${spring.application.name}:${spring.application.instance_id:${random.value}}

#Config Hibernate
logging.level.org.hibernate.engine.jdbc.env.internal.LobCreatorBuilderImpl=ERROR
spring.jackson.serialization.fail-on-empty-beans=false

#Tuning Hikari Configuration Parameters
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000

###Database : POSTGRESQL
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

###Database : Paramètres partagés
spring.datasource.username=postgres
spring.datasource.password=Az@zel84
spring.datasource.driver-class-name=org.postgresql.Driver

### DEV ###
spring.datasource.url=jdbc:postgresql://localhost:5432/cvtheque-opportunite-service

