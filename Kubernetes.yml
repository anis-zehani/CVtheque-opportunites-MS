apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: opportunites-deployment
  labels:
    app: opportunites-MS
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opportunites-MS
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: opportunites-MS
    spec:
      containers:
      - name: opportunites-container
        image: registry.gitlab.com/gitlabodix/cvtheque-opportunites-ms-prod
        args: ["--spring.profiles.active=prod"]
        imagePullPolicy: Never
        ports:
        - containerPort: 8002
      imagePullSecrets:
      - name: gitlab-secrets-opportunites-ms
---
apiVersion: v1
kind: Service
metadata:
  name: opportunites-service
spec:
  selector:
    app: opportunites-MS
  ports:
    - port: 8002
      targetPort: 8002

